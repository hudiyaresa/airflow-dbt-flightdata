name: 'warehouse_pacflight'

config-version: 2
version: '0.1'

profile: 'warehouse'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analysis"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
    - "target"
    - "dbt_modules"
    - "logs"

require-dbt-version: [">=1.0.0", "<2.0.0"]

# Dimensions are SCD2 snapshots in snapshots/, facts are rebuilt as tables on every run
models:
  warehouse_pacflight:
    marts:
      +materialized: table
